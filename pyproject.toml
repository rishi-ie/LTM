[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltm-poc"
version = "0.1.0"
description = "Minimal semantic-field proof of concept for Latent Topology Models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.7,<3",
  "torch>=2.3,<3",
  "transformers>=4.40,<5",
  "sentence-transformers>=3,<6",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
ltm-poc = "ltm_poc.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
