[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parasite-ltm-runtime"
version = "0.1.0"
description = "Persistent modular runtime for LTM-ARCH-1.2"
requires-python = ">=3.11,<3.12"
dependencies = ["latent-topology-models==0.1.0", "numpy==2.4.6"]

[project.optional-dependencies]
neural = ["torch==2.13.0", "transformers==5.14.1", "sentence-transformers==5.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
